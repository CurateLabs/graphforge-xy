name: First PyPI alpha

# Branch-local bootstrap; this filename and environment bind the PyPI publisher.
on:
  push:
    tags: ["xyg-v0.0.1a1"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Build native core and client
        run: |
          cargo build --release
          npm ci
          node js/build.mjs
      - name: Build distributions
        env:
          XYG_REQUIRE_CARGO: "1"
        run: |
          uv build
          uv tool run --from auditwheel --with patchelf auditwheel repair dist/*.whl --plat manylinux_2_39_x86_64 --only-plat -w repaired
          rm dist/*.whl
          cp repaired/*.whl dist/
      - name: Verify archives and size
        run: |
          python3 scripts/verify_wheel.py dist/*.whl --expect-native
          python3 scripts/verify_sdist.py dist/*.tar.gz
          uv tool run --from twine twine check --strict dist/*
          test "$(stat -c %s dist/*.whl)" -le 15728640
      - name: Prove clean wheel and source installs
        env:
          XYG_REQUIRE_CARGO: "1"
        run: |
          cp scripts/plain_python_smoke.py "$RUNNER_TEMP/plain-python-smoke.py"
          uv venv /tmp/xyg-wheel-smoke
          uv pip install -p /tmp/xyg-wheel-smoke dist/*.whl
          /tmp/xyg-wheel-smoke/bin/python "$RUNNER_TEMP/plain-python-smoke.py"
          uv venv /tmp/xyg-source-smoke
          uv pip install --no-cache -p /tmp/xyg-source-smoke dist/*.tar.gz
          /tmp/xyg-source-smoke/bin/python "$RUNNER_TEMP/plain-python-smoke.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-alpha-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.repository == 'CurateLabs/xyg' && github.ref == 'refs/tags/xyg-v0.0.1a1' && vars.XYG_ALLOW_PYPI_PUBLISH == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python3 scripts/check_release_version.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: first-alpha-distributions
          path: dist
      - name: Require exact package identity and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(Path('dist').iterdir())
          assert len(files) == 2, files
          assert any(p.name == 'xyg-0.0.1a1.tar.gz' for p in files), files
          assert all(p.name.startswith('xyg-0.0.1a1') for p in files), files
          PY
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          skip-existing: true
